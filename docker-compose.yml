services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: honey-store-app
    container_name: honey-store-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
    ports:
      - "80:8080"
    networks:
      - honey-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: honey-store-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-honey_store}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - honey-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: honey-store-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
    depends_on:
      - db
    networks:
      - honey-network

networks:
  honey-network:
    driver: bridge

volumes:
  db-data:
    driver: local
