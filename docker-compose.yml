services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: honey-store-app
    container_name: honey-store-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
#      - ./:/var/www
      - /var/www/vendor
      - /var/www/node_modules
      - ./storage:/var/www/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://64.227.119.110
      - ASSET_URL=http://64.227.119.110
      - FORCE_HTTPS=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=honey_store
      - DB_USERNAME=honey_user
      - DB_PASSWORD=user_password
    ports:
      - "80:8080"
    networks:
      - honey-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: honey-store-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-honey_store}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_PASSWORD: ${DB_PASSWORD:-user_password}
      MYSQL_USER: ${DB_USERNAME:-honey_user}
    networks:
      - honey-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: honey-store-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
    depends_on:
      - db
    networks:
      - honey-network

networks:
  honey-network:
    driver: bridge

volumes:
  db-data:
    driver: local
