services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: honey-store-app
    container_name: honey-store-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
#      - ./:/var/www
      - /var/www/vendor
      - /var/www/node_modules
      - ./storage:/var/www/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    ports:
      - "8080:8080"
    networks:
      - honey-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: honey-store-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-honey_store}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_PASSWORD: ${DB_PASSWORD:-user_password}
      MYSQL_USER: ${DB_USERNAME:-honey_user}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - honey-network

networks:
  honey-network:
    driver: bridge

volumes:
  db-data:
    driver: local
